[package]
name = "webrtc-sys"
version = "0.3.42"
edition.workspace = true
homepage = "https://livekit.io"
license.workspace = true
description = "Unsafe bindings to libwebrtc"
repository.workspace = true

[features]
default = []

[dependencies]
cxx = "1.0"
log = { workspace = true }

[build-dependencies]
# ato patch: version dep (as crates.io normalized it) — see libwebrtc/Cargo.toml.
webrtc-sys-build = { version = "0.3.18" }
cxx-build = "1.0"
glob = "0.3"
cc = { workspace = true }
pkg-config = "0.3.22"

[target.'cfg(target_os = "linux")'.build-dependencies]
pkg-config = "0.3.22"

[dev-dependencies]
env_logger = { workspace = true }
